# Installed once by deploy.sh; certbot --nginx then adds TLS to this file.
# Real client IP comes from conf.d/cloudflare-realip.conf.
server {
    listen 80;
    listen [::]:80;
    server_name vlrstats.lol www.vlrstats.lol;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    if ($host = www.vlrstats.lol) { return 301 https://vlrstats.lol$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:3260;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
